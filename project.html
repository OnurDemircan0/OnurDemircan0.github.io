<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/qrcode.min.js"></script>
</head>
<body>
    <header>
        <nav class="nav-buttons">
            <a href="index.html#home" class="nav-link"><button class="nav-btn" data-i18n="nav_home">Home</button></a>
            <a href="index.html#about" class="nav-link"><button class="nav-btn" data-i18n="nav_about">About Me</button></a>
            <a href="index.html#projects" class="nav-link"><button class="nav-btn" data-i18n="nav_projects">My Projects</button></a>
            <a href="index.html#contact" class="nav-link"><button class="nav-btn" data-i18n="nav_contact">Contact</button></a>
        </nav>
        <div class="lang-selector">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="tr">TR</button>
        </div>
    </header>

    <main>
        <section class="content-section project-detail-section">
            <div class="project-header">
                <a href="index.html#projects" class="back-btn" data-i18n="btn_back">← Back to Projects</a>
            </div>    
            
            <div id="project-detail-container" style="display: none; margin-top: 2rem;">
                <h1 id="proj-title" class="title"></h1>
                
                <div class="project-layout">
                    <!-- Image Gallery / Carousel -->
                    <div class="project-gallery">
                        <div class="main-img-wrapper main-image-container" style="border-radius: 15px; min-height: 200px; position: relative;">
                            <img id="main-gallery-img" src="" alt="Project Image" class="image-fade" onload="this.classList.add('loaded')" style="border-radius: 15px;">
                            <div class="gallery-controls" id="gallery-controls" style="display: none;">
                                <button id="prev-img" class="gallery-btn">❮</button>
                                <button id="next-img" class="gallery-btn">❯</button>
                            </div>
                        </div>
                        <div id="gallery-thumbnails" class="gallery-thumbnails"></div>
                    </div>

                    <!-- Details -->
                    <div class="project-content">
                        <p id="proj-desc" class="paragraph" style="margin-bottom: 2rem;"></p>
                        
                        <div class="project-actions" style="display: flex; gap: 1rem; align-items: center; margin-top: 1rem; flex-wrap: wrap;">
                              <a id="play-store-link" href="#" target="_blank" class="store-badge-link" style="transition: transform 0.2s ease;">
                                  <img src="assets/images/GetItOnGooglePlay_Badge_Web_color_English.svg" alt="Get it on Google Play" style="height: 45px;">
                              </a>
                              <a id="app-store-link" href="#" target="_blank" class="store-badge-link" style="display: none; transition: transform 0.2s ease;">
                                  <img src="assets/images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg" alt="Download on the App Store" style="height: 45px;">
                              </a>
                              <a id="download-btn" href="#" target="_blank" class="cta-btn primary-btn download-btn" style="display: none; height: 45px; align-items: center; gap: 0.5rem; padding: 0 1.5rem; margin-top: 0; text-decoration: none; font-weight: 600; box-sizing: border-box;">
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                  <span data-i18n="btn_download">Download</span>
                              </a>
                              <div id="qr-container" class="glass-card qr-widget" style="display: none; height: 45px; align-items: center; gap: 0.65rem; padding: 0 0.85rem; border-radius: 12px; cursor: pointer; user-select: none; box-sizing: border-box; transition: transform 0.2s ease, border-color 0.2s ease;" title="Click to enlarge QR code">
                                  <div id="qr-code-mini" style="width: 30px; height: 30px; background: #fff; border-radius: 6px; padding: 2px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box;"></div>
                                  <div style="display: flex; flex-direction: column; justify-content: center; text-align: left;">
                                      <span style="font-size: 0.8rem; font-weight: 600; color: #fff; line-height: 1.1;" data-i18n="qr_title">Scan QR</span>
                                      <span style="font-size: 0.68rem; color: rgba(255, 255, 255, 0.65); line-height: 1.1;" data-i18n="qr_subtitle">Play on mobile</span>
                                  </div>
                              </div>
                              <a id="privacy-link" href="#" target="_blank" class="cta-btn secondary-btn" style="height: 45px; display: inline-flex; align-items: center; padding: 0 1.5rem; margin-top: 0; display: none;">
                                  <span data-i18n="btn_privacy">Privacy Policy</span>
                              </a>
                              <a id="terms-link" href="#" target="_blank" class="cta-btn secondary-btn" style="height: 45px; display: inline-flex; align-items: center; padding: 0 1.5rem; margin-top: 0; display: none;">
                                  <span data-i18n="btn_terms">Terms of Use</span>
                              </a>
                          </div>
                    </div>
                </div>
            </div>
            
            <div id="error-container" style="display: none; text-align: center; margin-top: 3rem;">
                <h2 data-i18n="error_not_found">Project not found.</h2>
            </div>
        </section>
    </main>
    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="lightbox-modal" style="display: none;">
        <span class="lightbox-close">&times;</span>
        <button id="lightbox-prev" class="lightbox-btn">❮</button>
        <img class="lightbox-content" id="lightbox-img" alt="Zoomed Image">
        <button id="lightbox-next" class="lightbox-btn">❯</button>
    </div>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="lightbox-modal qr-modal" style="display: none; align-items: center; justify-content: center;">
        <div class="glass-card" style="max-width: 360px; width: 90%; padding: 2rem 1.5rem; text-align: center; border-radius: 20px; position: relative;">
            <button id="qr-modal-close" class="gallery-btn" style="position: absolute; top: 0.8rem; right: 0.8rem; width: 34px; height: 34px; font-size: 1.2rem; cursor: pointer;">&times;</button>
            <h3 id="qr-modal-title" style="margin-bottom: 0.35rem; color: #fff;" data-i18n="qr_modal_title">Scan to Download</h3>
            <p style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); margin-bottom: 1.25rem;" data-i18n="qr_modal_desc">Scan this QR code with your phone camera to download.</p>
            <div id="qr-code-large" style="width: 220px; height: 220px; background: #fff; padding: 12px; border-radius: 16px; margin: 0 auto 1.25rem auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);"></div>
            <p id="qr-game-name" style="font-size: 0.95rem; font-weight: 600; color: var(--accent-color, #38bdf8); margin: 0;"></p>
        </div>
    </div>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/project-detail.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
